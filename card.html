<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #a06f06;

        }

        .container {
            text-align: center;
            background: #b3780c;
            padding: 25px;
            border-radius: 25px;
            margin: 300px 0 30px 250px;
            width: 700px;
            height: 200px;
            box-shadow: 0 0 0 #aa7e05;
        }

        .card-game {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card-front {
            position: absolute;
            inset: 0;
            height: 80px;
            width: 80px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            box-shadow: 0 0 0 2px #754d02;
            border-radius: 20px;
        }

        .card {
            width: 80px;
            height: 80px;
            position: relative;
        }

        .card-front img {
            height: 70px;
            width: 70px;
        }

        .tile {
            background-image: url("screenshots/img-9.png");
            background-size: 70px 70px;
            transition: 2s;
        }

        .card-back {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            inset: 0;
            transition: .7s;
        }

        .card-back img {
            height: 70px;
            width: 70px;
            padding: 10px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>memory game</h1>

        <div class="card-game" id="card-game"></div>

        <button>reset</button>
    </div>
</body>
<script>
    let images = [
        'screenshots/img-1',
        'screenshots/img-2',
        'screenshots/img-3',
        'screenshots/img-4',
        'screenshots/img-5',
        'screenshots/img-6',
        'screenshots/img-7',
        'screenshots/img-8'
    ];

    const game = document.getElementById("card-game");
    const rows = 8;
    const cols = 8;

    let cardimages = images.concat(images);

    cardimages.sort(() => 
        Math.random() - 0.5
    );

    for (let i = 0; i < cardimages.length; i++) {

        const card = document.createElement("div");
        card.className = "card";

        // Front
        const front = document.createElement("div");
        front.className = "card-front";

        // Back
        const back = document.createElement("div");
        back.className = "card-back";

        back.innerHTML = `<img src="${cardimages[i]}.png">`;


        for (let y = 0; y < rows; y++) {

            for (let x = 0; x < cols; x++) {

                const tile = document.createElement("div");
                tile.className = "tile";

                tile.style.backgroundPosition =
                    `${-(x * 70 / cols)}px ${-(y * 70 / rows)}px`;

                front.appendChild(tile);

            }

        }

        card.appendChild(front);
        card.appendChild(back);
        card.onclick = () => {

            const tiles = card.querySelectorAll(".tile");

            const flipSound = new Audio("audio.mp3");
            let maxDelay = 0;

            flipSound.currentTime = 0;
            flipSound.play();

            tiles.forEach(tile => {

                const delay = Math.random() * 500;

                if (delay > maxDelay) {
                    maxDelay = delay;
                }
                setTimeout(() => {

                    tile.style.opacity = 0;
                    tile.style.transform =
                        `scale(0) rotate(${Math.random() * 360}deg)`;

                }, delay);

            });

            setTimeout(() => {
                back.style.opacity = 1;
            }, maxDelay + 300);
        };

        game.appendChild(card);
    };

</script>

</html>
